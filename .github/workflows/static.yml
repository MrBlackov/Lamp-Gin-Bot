name: Deploy static content to Pages

on:
  push:
    branches: ["master", "v_skills"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 👈 ВАЖНО: для плагинов с датами (git-revision-date-localized)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 👈 Указываем версию Python

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material
          pip install mkdocs-awesome-pages-plugin
          pip install mkdocs-git-revision-date-localized-plugin
          # 👇👇👇 ДОБАВЬТЕ ВАШИ ПЛАГИНЫ СЮДА 👇👇👇
          # pip install mkdocs-minify-plugin
          # pip install mkdocstrings
          # pip install mkdocs-minify-html-plugin
          # и так далее — все, что есть в вашем mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'  # 👈 MkDocs по умолчанию строит в папку site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
